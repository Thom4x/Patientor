services:

  app:
    image: patientor-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patientor-front-prod
    depends_on:
      - server
  server:
    image: patientor-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patientor-back-prod

  nginx:
    image: nginx:1.29
    container_name: patientor-nginx-reverse-proxy-prod
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - server
